name: Run tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint code
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff check
        run: ruff check .
  test:
    runs-on: ubuntu-latest
    name: Run tests
    needs: lint

    steps:
      - uses: actions/checkout@v5
        name: Checkout repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        name: Install python
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        name: Install dependencies
      - run: pytest -q
        name: Run pytest